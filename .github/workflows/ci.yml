name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff, mypy, alembic, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pta
          POSTGRES_PASSWORD: pta
          POSTGRES_DB: personal_teacher_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pta -d personal_teacher_assistant"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Test-only values; no real secrets are needed (LLM/TTS/storage use fakes).
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://pta:pta@localhost:5432/personal_teacher_assistant
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-test-secret-key-not-for-production
      TTS_PROVIDER: fake
      OPENAI_API_KEY: sk-test-not-a-real-key
      S3_BUCKET: pta-media
      S3_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY_ID: test
      S3_SECRET_ACCESS_KEY: test
      GOOGLE_CLIENT_ID: ci-web-client-id
      GOOGLE_ANDROID_CLIENT_ID: ci-android-client-id
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install system packages (ffmpeg, Noto fonts)
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-core fonts-noto-ui-core

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy app

      - name: Alembic migrations
        run: alembic upgrade head

      - name: Pytest
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  admin:
    name: Admin web (lint, type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:8000

  mobile:
    name: Mobile (lint, type-check, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm test -- --ci

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend, admin]
    steps:
      - uses: actions/checkout@v4

      - name: Validate compose files
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      - name: Build images
        run: docker compose build
